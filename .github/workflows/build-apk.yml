name: Gerar APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Copiar o visualizador para dentro do app
        run: sh build.sh

      - name: Compilar
        run: gradle --no-daemon assembleDebug

      - name: Renomear
        run: cp app/build/outputs/apk/debug/app-debug.apk AranhaDigital.apk

      - uses: actions/upload-artifact@v4
        with:
          name: AranhaDigital-apk
          path: AranhaDigital.apk

      - name: Publicar para download direto (aba Releases)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v2.0-build${{ github.run_number }}"
          gh release create "$TAG" AranhaDigital.apk \
            --target "${{ github.sha }}" \
            --title "Aranha Digital 2.0 (build ${{ github.run_number }})" \
            --notes "Toque em AranhaDigital.apk abaixo para baixar e instalar no Android 7 ou mais novo."
