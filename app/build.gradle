plugins {
    id 'com.android.application'
}

android {
    namespace 'br.aranhadigital'
    compileSdk 34

    defaultConfig {
        applicationId 'br.aranhadigital.app'
        minSdk 24          // Android 7.0 ou mais novo
        targetSdk 34
        versionCode 3
        versionName '2.1'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
